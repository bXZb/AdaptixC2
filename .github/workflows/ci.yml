name: CI

on:
  push:
    branches: [testing-v2.0, main, dev, "wip/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: "6.9.2"

jobs:
  server:
    name: Server (axtool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdaptixServer/go.mod
          cache-dependency-path: |
            AdaptixServer/go.sum
            AdaptixServer/go.work.sum
            AdaptixServer/extenders/*/go.sum
            AdaptixTools/go.sum

      - name: Build axtool
        working-directory: AdaptixTools
        run: make

      - name: Build server and packages (axtool)
        run: ./AdaptixTools/dist/axtool adaptix.spec server build -d

      - name: Check runtime profile registered plugins
        run: |
          test -x dist/adaptixserver
          grep -q 'extenders/beacon_listener_http/config.yaml' dist/profile.yaml
          grep -q 'extenders/beacon_agent/config.yaml' dist/profile.yaml
          test -f dist/extenders/beacon_listener_http/listener_beacon_http.so
          test -f dist/extenders/beacon_agent/agent_beacon.so

      - name: Test server workspace
        working-directory: AdaptixServer
        run: go test ./...

  client:
    name: Client (Qt6 build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev libsqlite3-dev

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            -m qtwebsockets qtnetworkauth --outputdir /opt/qt

      - name: Configure
        run: cmake -S AdaptixClient -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/qt/${{ env.QT_VERSION }}/gcc_64

      - name: Build
        run: cmake --build build -j$(nproc)
